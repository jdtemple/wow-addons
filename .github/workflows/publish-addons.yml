name: Publish Addons

on:
  push:
    branches: [ main ]
    paths:
      - 'angler-biggins/**'
      - 'autojoin-biggins/**'
      - 'chatlink-biggins/**'
      - 'lazyspeed-biggins/**'
      - 'perf-biggins/**'
      - 'saferelease-biggins/**'
      - 'summonpet-biggins/**'
      - 'lib-biggins-suite/**'
  workflow_dispatch:
    inputs:
      target:
        description: 'Addon to publish (or "all")'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - angler-biggins
          - autojoin-biggins
          - chatlink-biggins
          - lazyspeed-biggins
          - perf-biggins
          - saferelease-biggins
          - summonpet-biggins
      releaseType:
        description: 'Release Channel'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - beta
          - alpha
      force:
        description: 'Force upload even if Git tag already exists'
        required: false
        default: false
        type: boolean

jobs:
  detect-changes:
    name: Detect Changed Addons
    runs-on: windows-latest
    outputs:
      addons: ${{ steps.detect.outputs.matrix }}
      suite_tag: ${{ steps.detect.outputs.suite_tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Determine Changed Addons
        id: detect
        shell: pwsh
        run: |
          ./scripts/detect-changed-addons.ps1 -ManualTarget "${{ github.event.inputs.target }}"

  publish:
    name: Publish ${{ matrix.addon }}
    needs: detect-changes
    if: needs.detect-changes.outputs.addons != '[]' && needs.detect-changes.outputs.addons != ''
    runs-on: windows-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        addon: ${{ fromJson(needs.detect-changes.outputs.addons) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git Credentials
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Package & Publish to CurseForge
        shell: pwsh
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
        run: |
          $envLen = if ($env:CF_API_KEY) { $env:CF_API_KEY.Length } else { 0 }
          $secLen = if ('${{ secrets.CF_API_KEY }}') { '${{ secrets.CF_API_KEY }}'.Length } else { 0 }
          Write-Host "CF_API_KEY env character count: $envLen"
          Write-Host "CF_API_KEY secret character count: $secLen"
          $relType = "${{ github.event.inputs.releaseType }}"
          if ([string]::IsNullOrWhiteSpace($relType)) { $relType = "release" }
          $forceFlag = "${{ github.event.inputs.force }}"
          $forceArg = if ($forceFlag -eq "true") { @("-Force") } else { @() }
          ./scripts/publish-curseforge.ps1 -Addon "${{ matrix.addon }}" -ReleaseType $relType -ApiKey "$env:CF_API_KEY" @forceArg

  tag-suite:
    name: Tag LibBigginsSuite
    needs: detect-changes
    if: needs.detect-changes.outputs.suite_tag != ''
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git Credentials
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Tag Suite Library
        shell: pwsh
        run: |
          $suiteTag = "${{ needs.detect-changes.outputs.suite_tag }}"
          Write-Host "Evaluating Git tag for shared suite: $suiteTag"
          $remoteTag = git ls-remote --tags origin "refs/tags/$suiteTag" 2>$null
          if ([string]::IsNullOrWhiteSpace($remoteTag)) {
              Write-Host "Creating Git tag: $suiteTag"
              git tag $suiteTag
              git push origin "refs/tags/$suiteTag"
              Write-Host "Successfully pushed Git tag '$suiteTag' to GitHub!"
          } else {
              Write-Host "Git tag '$suiteTag' already exists on remote origin; skipping."
          }
